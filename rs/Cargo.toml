[package]
name = "wtx"
version = "0.0.0"
edition = "2021"
description = "Bun PTY WebSocket server with replay buffer + tmux-free session management"
license = "MIT"

[lib]
name = "wtx"
path = "src/lib.rs"

[[bin]]
name = "wtx"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
