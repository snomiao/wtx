# Builds the Rust `wtx` binary for every platform, packs it together with the
# TypeScript the package ships, and checks on Linux, macOS and Windows (x64
# and arm64) that `bun i -g` / `npm i -g` gives a working `wtx` command that
# hands its command lines to wtx.mjs.
#
# It does not publish. Releases still go through release.yml.
#
# The pipeline lives in https://github.com/snomiao/rustify.

name: rust-npm-release

on:
  pull_request:
    # The smoke lines below run wtx.mjs and src/server.ts, and rely on where
    # src/server.ts stops (see smoke-env), so a change there reruns them.
    paths:
      - "rs/**"
      - "src/**"
      - "wtx.mjs"
      - "package.json"
      - ".github/workflows/rust-npm-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without a leading v (default: the version in rs/Cargo.toml)"
        required: false
        type: string

jobs:
  build:
    uses: snomiao/rustify/.github/workflows/rust-npm-build.yml@releases/v1
    with:
      manifest: rs/Cargo.toml
      bins: wtx
      version: ${{ inputs.version }}
      # wtx.mjs reads no arguments: every command line, --help and --version
      # included, starts the terminal server and keeps it running, so nothing
      # it answers ever exits 0. The first command is therefore one that is
      # meant to fail before the server listens: `[1]` says it ends with exit
      # code 1. The binary hands it back, as it does every command line.
      smoke: "[1] wtx"
      smoke-expect: is out of range
      # Each smoke command gets these. src/server.ts reads TERMINAL_WS_PORT
      # with parseInt and hands it to Bun.serve, which refuses 99999 before it
      # binds anything (ERR_OUT_OF_RANGE, the same on Linux, macOS and
      # Windows), so wtx.mjs exits 1 without listening. Should it get past
      # that all the same, it would bind to 192.0.2.1, an address reserved
      # for documentation that no runner has, and fail there. Before that,
      # the module writes its small zsh configuration under the runner's temp
      # directory (koho-term-zshrc), as every start of wtx does.
      # (A temp directory name no file system accepts would stop it earlier,
      # but bun on Windows hangs with such a TEMP instead of failing.)
      smoke-env: |
        TERMINAL_WS_PORT=99999
        TERMINAL_WS_HOST=192.0.2.1
      # Handed back to wtx.mjs on every platform (rs/src/js_fallback.rs is
      # helper v5, so [handback] is checked), which fails at Bun.serve with
      # exit code 1 and never says it is listening: with no arguments, and
      # with --version.
      smoke-extra: |
        [1] [handback] wtx => is out of range !> listening
        [1] [handback] wtx --version => is out of range !> listening
